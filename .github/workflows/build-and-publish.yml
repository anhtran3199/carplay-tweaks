name: Build tweaks and publish Sileo repo

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5

      - name: Build SplitCarPlay
        run: |
          cd SplitCarPlay
          make clean package FINALPACKAGE=1

      - name: Build VietmapLiveExport
        run: |
          cd VietmapLiveExport
          make clean package FINALPACKAGE=1

      - name: Install dpkg-deb (for generating Packages metadata)
        run: brew install dpkg

      - name: Assemble Sileo repo
        run: |
          set -euo pipefail
          mkdir -p _site/debs
          cp SplitCarPlay/packages/*.deb _site/debs/
          cp VietmapLiveExport/packages/*.deb _site/debs/
          cp -R site/. _site/
          python3 repo-tools/make_packages.py _site/debs _site/Packages
          gzip -9 -k -f _site/Packages
          echo "Packages written:"
          cat _site/Packages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
