name: Build tweaks and publish Sileo repo

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5

      # The SDK theos-action's default setup resolves as "latest" turned
      # out to be the macOS runner's own bundled Xcode SDK (confirmed in
      # an earlier build's error path: .../Xcode_26.6.app/.../iPhoneOS26.5.sdk),
      # which -- like every official Apple SDK since Xcode 7.3 -- ships
      # zero private-framework stubs. That's why linking against
      # Preferences.framework (needed to statically subclass
      # PSListController for the Settings prefs bundle) failed with
      # "framework not found". theos/sdks' own release assets are
      # patched to include those stubs; installing one explicitly and
      # pointing Prefs.bundle's TARGET at it by exact version (not
      # "latest") fixes that.
      - name: Install a private-framework-patched iOS SDK (for Preferences.framework)
        run: |
          curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          ls "$THEOS/sdks"

      # THEOS_PACKAGE_SCHEME=rootless targets modern rootless jailbreaks
      # (Dopamine, roothide, ...) -- the ones this repo is actually meant
      # for (confirmed target device: iPhone 7, iOS 15.8.8, Dopamine 2).
      # Theos handles this by using the /var/jb install prefix and
      # rewriting the packaged control's Architecture to iphoneos-arm64
      # automatically; nothing else in our Makefiles needs to change.
      - name: Build SplitCarPlay
        env:
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd SplitCarPlay
          make clean package FINALPACKAGE=1

      - name: Install dpkg-deb (for generating Packages metadata)
        run: brew install dpkg

      - name: Assemble Sileo repo
        run: |
          set -euo pipefail
          mkdir -p _site/debs
          cp SplitCarPlay/packages/*.deb _site/debs/
          cp -R site/. _site/
          python3 repo-tools/make_packages.py _site/debs _site/Packages
          gzip -9 -k -f _site/Packages
          python3 repo-tools/make_release.py _site _site/Release
          echo "Packages written:"
          cat _site/Packages
          echo "Release written:"
          cat _site/Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
